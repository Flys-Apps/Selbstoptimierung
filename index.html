<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selbstoptimierung</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap">
<style>
:root{--bg:#040d24;--card:#0a1a3a;--ink:#ffffff;--mut:#8fb0cc;--line:#17305a;--ac:#22d3ee;--up:#34d399;--down:#ff7b6b;--font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(ellipse at 85% -10%,#0b3270 0%,rgba(4,13,36,0) 60%) fixed;color:var(--ink);font:16px/1.5 var(--font)}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:18px}.brand img{width:min(280px,76%);height:auto;display:block}
h1{font-size:1.1rem;font-weight:500;color:var(--mut);margin:0}
nav{position:relative;margin-bottom:14px;z-index:20}
.mn{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:4px;max-height:72vh;overflow-y:auto;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.mh{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:10px 12px 2px}
nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;min-height:46px;border-radius:8px;font:inherit;font-size:1rem;cursor:pointer}
.mn button{border-color:transparent;background:transparent}
nav button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 0 40px rgba(34,211,238,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{font-size:.85rem;color:var(--mut)}
.v{font-size:clamp(1.5rem,7vw,2rem);font-weight:700;line-height:1.15;color:var(--ac);letter-spacing:-.01em}
.d{font-size:.85rem;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mut)}
h2{font-size:1.15rem;margin:0 0 12px;font-weight:700}
label{display:block;font-size:.88rem;color:var(--mut);margin:0 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-height:44px}
input[type=range]{padding:0;accent-color:var(--ac)}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row>div{flex:1 1 110px}
.btn{background:var(--ac);color:#04122e;border:1px solid var(--ac);border-radius:8px;padding:10px 14px;min-height:44px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--bg);color:var(--ink);border-color:var(--line);font-weight:500}
.ch{width:100%;height:auto;display:block}
.ch text{font-size:9px;fill:var(--mut);font-family:var(--font)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px;font:inherit;font-size:.92rem;cursor:pointer}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid var(--line);font-size:.92rem}
li:first-child{border-top:0}
li small{color:var(--mut)}
li button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:1rem}
.empty{color:var(--mut);font-size:.92rem;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:12px}.cal b{font-size:.75rem;color:var(--mut);font-weight:500}
.cd{border:1px solid var(--line);border-radius:8px;min-height:48px;background:transparent;color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center}.cd i{font-style:normal;font-size:7px;letter-spacing:1px;color:var(--ac)}.cd.sel{outline:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
</style>
</head>

<script>
const TABS=[["home","Übersicht"],["cal","Kalender"],["steps","Schritte"],["weight","Gewicht"],["sleep","Schlaf"],["health","Beschwerden"],["water","Wasser"],["food","Ernährung"],["log","Tagebuch"],["vit","Körperwerte"],["meds","Medikamente"],["smoke","Rauchen"],["rev","Rückblick"],["ins","Analyse"]];
const GROUPS=[["Start",["home","cal"]],["Körper",["steps","weight","vit","sleep"]],["Gesundheit",["health","meds","smoke"]],["Alltag",["water","food","log"]],["Auswertung",["rev","ins"]]];
const MOOD=["sehr schlecht","schlecht","okay","gut","sehr gut"];
const SYM=["Husten","Schnupfen","Raucherhusten","Magen-Darm","Halsschmerzen","Kopfschmerzen","Fieber","Müdigkeit","Sodbrennen","Knieschmerzen"];
const SEV=["leicht","mittel","stark"];
let D={steps:{},weight:{},sleep:{},health:[],water:{},goal:2500,log:{},goals:{steps:10000,sleep:8,weight:0},vit:{},meds:[],medlog:{},smoke:{},food:{},plan:{base:0,every:7,price:0,pack:20,start:""},pin:""},tab="home",sel=[],rng=7,editH=null,cm=0,cs=null;
try{const r=localStorage.getItem("selbstopt");if(r)D=Object.assign(D,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("selbstopt",JSON.stringify(D))}catch(e){}};
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=n=>Math.round(n).toLocaleString("de-DE");
const fmtD=s=>{const [y,m,d]=s.split("-");return d+"."+m+"."+y};
const sum=(o,a,b)=>{let t=0;for(let d=new Date(a);d<=b;d=addD(d,1))t+=o[iso(d)]||0;return t};
const mon=d=>addD(d,-((d.getDay()+6)%7));
function delta(c,p){if(!p)return'<span class="d flat">kein Vergleichswert</span>';const x=(c-p)/p*100;const cl=x>0.5?"up":x<-0.5?"down":"flat";return'<span class="d '+cl+'">'+(x>0?"▲ +":x<0?"▼ ":"● ")+x.toFixed(0)+" %</span>"}
function bars(items,goal){const W=320,H=120,bw=W/items.length;const max=Math.max(goal||0,...items.map(i=>i.v),1);
let s='<svg viewBox="0 0 '+W+" "+(H+16)+'" class="ch" role="img">';
items.forEach((i,k)=>{const h=i.v/max*H;s+='<rect x="'+(k*bw+2)+'" y="'+(H-h)+'" width="'+(bw-4)+'" height="'+h+'" rx="2" fill="'+(goal&&i.v>=goal?"var(--up)":"var(--ac)")+'"/><text x="'+(k*bw+bw/2)+'" y="'+(H+12)+'" text-anchor="middle">'+i.l+"</text>"});
if(goal){const y=H-goal/max*H;s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--mut)" stroke-dasharray="4 3"/>'}
return s+"</svg>"}
function line(pts){if(pts.length<2)return'<p class="empty">Mindestens zwei Einträge für die Grafik nötig.</p>';
const W=320,H=130,p=12;const ys=pts.map(q=>q.v);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1){lo-=.5;hi+=.5}
const X=i=>p+i/(pts.length-1)*(W-2*p),Y=v=>H-p-(v-lo)/(hi-lo)*(H-2*p);
let s='<svg viewBox="0 0 '+W+" "+(H+14)+'" class="ch" role="img"><path d="'+pts.map((q,i)=>(i?"L":"M")+X(i)+" "+Y(q.v)).join(" ")+'" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>';
if(pts[0].a!==undefined)s+='<path d="'+pts.map((q,i)=>(i?"L":"M")+X(i)+" "+Y(q.a)).join(" ")+'" fill="none" stroke="var(--up)" stroke-width="2" stroke-dasharray="5 3"/>';
pts.forEach((q,i)=>{if(pts.length<=40)s+='<circle cx="'+X(i)+'" cy="'+Y(q.v)+'" r="3" fill="var(--ac)"/>'});
s+='<text x="'+p+'" y="'+(H+10)+'">'+pts[0].l+'</text><text x="'+(W-p)+'" y="'+(H+10)+'" text-anchor="end">'+pts[pts.length-1].l+'</text><text x="'+p+'" y="10">'+hi.toFixed(1)+'</text><text x="'+p+'" y="'+(H-14)+'">'+lo.toFixed(1)+"</text></svg>";return s}
const last=n=>{const a=[];for(let i=n-1;i>=0;i--)a.push(addD(new Date(),-i));return a};
const dayL=d=>String(d.getDate())+"."+(d.getMonth()+1)+".";
const dateField=id=>'<div><label for="'+id+'">Datum</label><input type="date" id="'+id+'" value="'+today()+'" max="'+today()+'"></div>';
function hist(items){return items.length?"<ul>"+items.join("")+"</ul>":'<p class="empty">Noch keine Einträge.</p>'}

const R={
home(){const t=today(),g=D.goals,td=D.steps[t]||0,w=D.water[t]||0;
const sk=Object.keys(D.sleep).sort(),ls=sk.length?D.sleep[sk[sk.length-1]]:null,wk=Object.keys(D.weight).sort(),lw=wk.length?D.weight[wk[wk.length-1]]:null;
const sy=[...new Set(D.health.filter(h=>h.date===t).flatMap(h=>h.sym))],lg=D.log[t]||{};
const pb=(v,m)=>'<div class="bar"><i style="width:'+Math.min(100,v/m*100)+'%"></i></div>';
const l=x=>(x/1000).toFixed(2).replace(".",",");
return'<div class="grid"><div class="card"><div class="k">Schritte heute</div><div class="v">'+fmt(td)+'</div>'+pb(td,g.steps)+'<div class="k">Ziel '+fmt(g.steps)+'</div></div>'+
'<div class="card"><div class="k">Wasser heute</div><div class="v">'+l(w)+' l</div>'+pb(w,D.goal)+'<div class="k">Ziel '+l(D.goal)+' l</div></div>'+
'<div class="card"><div class="k">Letzte Nacht'+(ls?" ("+fmtD(sk[sk.length-1]).slice(0,5)+")":"")+'</div><div class="v">'+(ls?ls.h+" h":"–")+'</div>'+(ls?pb(ls.h,g.sleep):"")+'<div class="k">'+(ls?"Intensität "+ls.q+" / 10 · Ziel "+g.sleep+" h":"Noch kein Eintrag")+'</div></div>'+
'<div class="card"><div class="k">Gewicht</div><div class="v">'+(lw!=null?lw.toFixed(1)+" kg":"–")+'</div><div class="k">'+(g.weight>0?"Ziel "+g.weight+" kg":"Kein Zielgewicht gesetzt")+'</div></div></div>'+
'<div class="card"><div class="k">Beschwerden heute</div><div style="font-weight:700">'+(sy.length?sy.join(", "):"Keine eingetragen")+'</div><div class="k" style="margin-top:6px">Stimmung heute: '+(lg.mood?MOOD[lg.mood-1]:"nicht eingetragen")+'</div></div>'+
homeExtra()+'<div class="card"><h2>Ziele</h2><div class="row"><div><label for="gs">Schritte pro Tag</label><input type="number" id="gs" value="'+g.steps+'" min="1"></div><div><label for="gl">Schlaf (Std.)</label><input type="number" id="gl" value="'+g.sleep+'" step="0.25" min="1" max="24"></div><div><label for="gw">Zielgewicht (kg, 0 = aus)</label><input type="number" id="gw" value="'+g.weight+'" step="0.1" min="0"></div><div><label for="gh">Körpergröße (cm)</label><input type="number" id="gh" value="'+(g.height||"")+'" min="0"></div><button class="btn" onclick="setGoals()">Speichern</button></div></div>'+pinCard()},
log(){const e=Object.keys(D.log).sort(),l7=e.filter(k=>k>=iso(addD(new Date(),-6)));
const av=f=>{const v=l7.map(k=>D.log[k][f]).filter(x=>x!=null);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):"–"};
const sm=f=>l7.reduce((a,k)=>a+(D.log[k][f]||0),0);
const num=(id,lb)=>'<div><label for="'+id+'">'+lb+'</label><input type="number" id="'+id+'" min="0" inputmode="numeric"></div>';
return'<div class="grid"><div class="card"><div class="k">Ø Stimmung (7 Tage)</div><div class="v">'+av("mood")+' / 5</div></div><div class="card"><div class="k">Training (7 Tage)</div><div class="v">'+sm("train")+' Min.</div></div><div class="card"><div class="k">Ø Koffein pro Tag</div><div class="v">'+(av("coff")==="–"?"–":Math.round(av("coff")))+' mg</div></div><div class="card"><div class="k">Alkohol (7 Tage)</div><div class="v">'+sm("alc")+' Getränke</div></div></div>'+
'<div class="card"><h2>Tag eintragen</h2><div class="row">'+dateField("ld")+'<div><label for="lm">Stimmung</label><select id="lm">'+MOOD.map((m,i)=>'<option value="'+(i+1)+'"'+(i===2?" selected":"")+'>'+(i+1)+" – "+m+"</option>").join("")+'</select></div></div><div class="row" style="margin-top:8px">'+num("lt","Training (Min.)")+num("lc","Koffein (mg)")+num("la","Alkohol (Getränke)")+num("lk","Stuhlgang (Anzahl)")+'</div><label style="display:flex;gap:8px;align-items:center;margin:12px 0;color:var(--ink)"><input type="checkbox" id="lx" style="width:auto;min-height:0"> Medikamente genommen</label><button class="btn" onclick="addLog()">Speichern</button></div>'+
'<div class="card"><h2>Stimmung'+(rng>30?" (Ø pro Monat)":"")+'</h2>'+rngBtn()+bars(ser(d=>(D.log[d]||{}).mood,"avg"),0)+'</div>'+
'<div class="card"><h2>Einträge</h2>'+hist([...e].reverse().slice(0,10).map(k=>{const x=D.log[k];return"<li><span>"+fmtD(k)+"<br><small>Stimmung "+x.mood+" · Training "+x.train+" Min. · Koffein "+x.coff+" mg · Alkohol "+x.alc+" · Stuhlgang "+x.stool+(x.med?" · Medikamente":"")+'</small></span><button aria-label="Bearbeiten" onclick="ed(\'log\',\''+k+'\')">✎</button> <button aria-label="Löschen" onclick="del(\'log\',\''+k+'\')">✕</button></li>'}))+'</div>'},
vit(){const e=Object.keys(D.vit).sort(),lim=rng>=365?"0000":iso(addD(new Date(),-rng));
const lastOf=f=>{const k=[...e].reverse().find(k=>D.vit[k][f]!=null);return k?D.vit[k][f]:null};
const ls=lastOf("sys"),ld=lastOf("dia"),lp=lastOf("pulse"),lf=lastOf("fat"),lw=lastOf("waist");
const pts=f=>e.filter(k=>k>=lim&&D.vit[k][f]!=null).map(k=>({l:fmtD(k).slice(0,5),v:D.vit[k][f]}));
const ch=(t,f,u)=>{const p=pts(f);return p.length?'<div class="card"><h2>'+t+' ('+u+')</h2>'+line(p)+"</div>":""};
const inp=(id,lb,st)=>'<div><label for="'+id+'">'+lb+'</label><input type="number" id="'+id+'" step="'+(st||1)+'" min="0" inputmode="decimal"></div>';
const val=(x,u)=>x==null?"–":x+u;
return'<div class="grid"><div class="card"><div class="k">Blutdruck</div><div class="v">'+(ls!=null&&ld!=null?ls+"/"+ld:"–")+'</div><div class="k">mmHg</div></div><div class="card"><div class="k">Ruhepuls</div><div class="v">'+val(lp," bpm")+'</div></div><div class="card"><div class="k">Körperfett</div><div class="v">'+val(lf," %")+'</div></div><div class="card"><div class="k">Taillenumfang</div><div class="v">'+val(lw," cm")+'</div></div></div>'+
'<div class="card"><h2>Werte eintragen</h2><div class="row">'+dateField("vd")+'</div><div class="row" style="margin-top:8px">'+inp("vs","Blutdruck oben")+inp("vi","Blutdruck unten")+inp("vp","Ruhepuls (bpm)")+'</div><div class="row" style="margin:8px 0 12px">'+inp("vf","Körperfett (%)","0.1")+inp("vw","Taille (cm)","0.5")+'</div><p class="k" style="margin:0 0 10px">Es reicht, nur die Werte auszufüllen, die du gemessen hast.</p><button class="btn" onclick="addV()">Speichern</button></div>'+
rngBtn()+ch("Blutdruck oben","sys","mmHg")+ch("Blutdruck unten","dia","mmHg")+ch("Ruhepuls","pulse","bpm")+ch("Körperfett","fat","%")+ch("Taillenumfang","waist","cm")+
'<div class="card"><h2>Einträge</h2>'+hist([...e].reverse().slice(0,10).map(k=>{const x=D.vit[k];return"<li><span>"+fmtD(k)+"<br><small>"+[x.sys!=null&&x.dia!=null?"Blutdruck "+x.sys+"/"+x.dia:"",x.pulse!=null?"Puls "+x.pulse:"",x.fat!=null?"Fett "+x.fat+" %":"",x.waist!=null?"Taille "+x.waist+" cm":""].filter(Boolean).join(" · ")+'</small></span><span><button aria-label="Bearbeiten" onclick="ed(\'vit\',\''+k+'\')">✎</button> <button aria-label="Löschen" onclick="del(\'vit\',\''+k+'\')">✕</button></span></li>'}))+"</div>"},
cal(){const n=new Date(),m=new Date(n.getFullYear(),n.getMonth()+cm,1),last=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),off=(m.getDay()+6)%7,MN=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
let c="";for(let i=0;i<off;i++)c+="<span></span>";
for(let d=1;d<=last;d++){const k=iso(new Date(m.getFullYear(),m.getMonth(),d)),h=[(D.steps[k]||0)>=D.goals.steps,(D.water[k]||0)>=D.goal,((D.sleep[k]||{}).h||0)>=D.goals.sleep],q=h.filter(Boolean).length;c+='<button class="cd'+(k===cs?" sel":"")+'" style="background:rgba(34,211,238,'+(q*.18)+')" onclick="cs=\''+k+'\';draw()">'+d+"<i>"+h.map(x=>x?"●":"○").join("")+"</i></button>"}
return'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><button class="btn sec" aria-label="Voriger Monat" onclick="cm--;draw()">‹</button><b>'+MN[m.getMonth()]+" "+m.getFullYear()+'</b><button class="btn sec" aria-label="Nächster Monat" onclick="cm++;draw()"'+(cm>=0?" disabled":"")+'>›</button></div><div class="cal">'+["Mo","Di","Mi","Do","Fr","Sa","So"].map(x=>"<b>"+x+"</b>").join("")+c+'</div><p class="k" style="margin:10px 0 0">Punkte: Schritt-, Wasser- und Schlafziel (● erreicht). Je mehr Ziele, desto heller. Tippe auf einen Tag für alle Einträge.</p></div>'+(cs?dayCard(cs):"")},
food(){const t=today(),fd=D.food,gk=D.goals.kcal||0,tot=d=>(fd[d]||[]).reduce((a,f)=>a+(f.kcal||0),0),all=[];
Object.keys(fd).forEach(d=>fd[d].forEach((f,i)=>all.push({d,i,f})));all.sort((a,b)=>b.d.localeCompare(a.d)||b.i-a.i);const td=tot(t);
return'<div class="card"><div class="k">Heute gegessen</div><div class="v">'+fmt(td)+" kcal"+(gk?" / "+fmt(gk):"")+"</div>"+(gk?'<div class="bar"><i style="width:'+Math.min(100,td/gk*100)+'%"></i></div>':"")+"</div>"+
'<div class="card"><h2>Mahlzeit eintragen</h2><div class="row">'+dateField("fe")+'<div><label for="fm">Mahlzeit</label><select id="fm">'+["Frühstück","Mittagessen","Abendessen","Snack"].map(x=>"<option>"+x+"</option>").join("")+'</select></div></div><div class="row" style="margin-top:8px"><div style="flex:2 1 180px"><label for="fn">Was hast du gegessen?</label><input type="text" id="fn" placeholder="z. B. Spaghetti mit Tomatensauce"></div><div><label for="fk">Kalorien (optional)</label><input type="number" id="fk" min="0" inputmode="numeric"></div></div><button class="btn" style="margin-top:10px" onclick="addF()">Speichern</button></div>'+
'<div class="card"><h2>Kalorienziel pro Tag</h2><div class="row"><div><input type="number" id="fg" value="'+(gk||"")+'" min="0" aria-label="Kalorienziel"></div><button class="btn" onclick="setKcal()">Speichern</button></div></div>'+
rngBtn()+'<div class="card"><h2>Kalorien'+(rng>30?" (Ø pro Monat)":"")+'</h2>'+bars(ser(d=>fd[d]?tot(d):undefined,"avg"),0)+"</div>"+
'<div class="card"><h2>Einträge</h2>'+hist(all.slice(0,15).map(({d,i,f})=>"<li><span>"+fmtD(d)+" · "+f.meal+"<br><small>"+esc(f.name)+(f.kcal?" · "+f.kcal+" kcal":"")+'</small></span><button aria-label="Löschen" onclick="delF(\''+d+'\','+i+')">✕</button></li>'))+"</div>"},
smoke(){const t=today(),x=D.smoke[t]||{},e=Object.keys(D.smoke).sort(),n=new Date(),g=(d,f)=>(D.smoke[d]||{})[f];
const sf=(f,a,b)=>{let s=0;for(let d=new Date(a);d<=b;d=addD(d,1))s+=g(iso(d),f)||0;return s};
const ws=mon(n),wd=Math.round((n-ws)/864e5),cw=sf("cig",ws,n),pw=sf("cig",addD(ws,-7),addD(ws,-7+wd));
const inv=h=>h.replace("d up","d X").replace("d down","d up").replace("d X","d down");
const ok=d=>D.smoke[d]&&D.smoke[d].cig===0;let c=0,d0=new Date();if(!D.smoke[iso(d0)])d0=addD(d0,-1);while(c<3650&&ok(iso(d0))){c++;d0=addD(d0,-1)}
const ctr=(l,f,v)=>'<div class="card"><div class="k">'+l+'</div><div class="v">'+v+'</div><div class="row" style="margin-top:8px"><button class="btn sec" onclick="smk(\''+f+'\',-1)">−1</button><button class="btn" onclick="smk(\''+f+'\',1)">+1</button></div></div>';
const inp=(id,lb)=>'<div><label for="'+id+'">'+lb+'</label><input type="number" id="'+id+'" min="0" inputmode="numeric"></div>';
return'<div class="grid">'+ctr("Zigaretten heute","cig",x.cig||0)+ctr("Nikotinfreie Vape heute (Züge)","vape",x.vape||0)+'</div>'+
'<div class="card"><div class="k">Nikotinpflaster heute</div><div class="v">'+(x.patch||0)+' mg</div><div class="chips" style="margin:8px 0 0">'+[7,14,21,0].map(m=>'<button class="'+(x.patch===m?"on":"")+'" onclick="sp('+m+')">'+(m?m+" mg":"Keins")+"</button>").join("")+"</div></div>"+
'<div class="grid"><div class="card"><div class="k">Zigaretten diese Woche</div><div class="v">'+cw+"</div>"+inv(delta(cw,pw))+'<div class="k">zur Vorwoche</div></div><div class="card"><div class="k">Zigarettenfreie Tage</div><div class="v">'+c+'</div><div class="k">in Folge</div></div></div>'+
planCard()+'<div class="card"><h2>Eintragen oder korrigieren</h2><div class="row">'+dateField("rd")+'</div><div class="row" style="margin:8px 0 12px">'+inp("rc","Zigaretten (Anzahl)")+inp("rp","Nikotinpflaster (mg)")+inp("rv","Nikotinfreie Vape (Züge)")+'</div><button class="btn" onclick="addS()">Speichern</button></div>'+
rngBtn()+'<div class="card"><h2>Zigaretten'+(rng>30?" (Summe pro Monat)":"")+'</h2>'+bars(ser(d=>g(d,"cig"),"sum"),0)+"</div>"+
'<div class="card"><h2>Nikotinpflaster (mg'+(rng>30?", Ø pro Monat":"")+')</h2>'+bars(ser(d=>g(d,"patch"),"avg"),0)+"</div>"+
'<div class="card"><h2>Nikotinfreie Vape (Züge'+(rng>30?", Summe pro Monat":"")+')</h2>'+bars(ser(d=>g(d,"vape"),"sum"),0)+"</div>"+
'<div class="card"><h2>Einträge</h2>'+hist([...e].reverse().slice(0,10).map(k=>{const y=D.smoke[k];return"<li><span>"+fmtD(k)+"<br><small>Zigaretten "+(y.cig==null?"–":y.cig)+" · Pflaster "+(y.patch==null?"–":y.patch+" mg")+" · Vape "+(y.vape==null?"–":y.vape)+'</small></span><span><button aria-label="Bearbeiten" onclick="edS(\''+k+'\')">✎</button> <button aria-label="Löschen" onclick="del(\'smoke\',\''+k+'\')">✕</button></span></li>'}))+"</div>"},
meds(){const t=today(),T=["Morgens","Mittags","Abends","Zur Nacht"],tk=D.medlog[t]||[];
const ms=[...D.meds].sort((a,b)=>T.indexOf(a.time)-T.indexOf(b.time)),day=d=>D.medlog[d]||[];
return'<div class="card"><h2>Heute</h2>'+(ms.length?'<ul>'+ms.map(m=>{const on=tk.includes(m.id);return'<li><span><b>'+esc(m.name)+'</b><br><small>'+esc(m.dose||"")+(m.dose?" · ":"")+m.time+'</small></span><button class="btn '+(on?"":"sec")+'" onclick="tm('+m.id+')">'+(on?"Genommen ✓":"Nehmen")+'</button></li>'}).join("")+'</ul>':'<p class="empty">Noch kein Medikamentenplan. Lege unten Medikamente an.</p>')+'</div>'+
'<div class="card"><h2>Medikament hinzufügen</h2><div class="row"><div><label for="mn">Name</label><input type="text" id="mn"></div><div><label for="md">Dosis (optional)</label><input type="text" id="md" placeholder="z. B. 1 Tablette"></div><div><label for="mt">Zeitpunkt</label><select id="mt">'+T.map(x=>"<option>"+x+"</option>").join("")+'</select></div><button class="btn" onclick="addM()">Hinzufügen</button></div></div>'+
(ms.length?'<div class="card"><h2>Einnahme, letzte 7 Tage</h2><ul>'+ms.map(m=>{const n=last(7).filter(d=>day(iso(d)).includes(m.id)).length;return'<li><span>'+esc(m.name)+'</span><span>'+n+' von 7 Tagen <button aria-label="Entfernen" onclick="delM('+m.id+')">✕</button></span></li>'}).join("")+'</ul></div>':"")},
rev(){const n=new Date(),ws=mon(n),wd=Math.round((n-ws)/864e5),ps=addD(ws,-7),pe=addD(ps,wd);
const vals=(f,a,b)=>{const o=[];for(let d=new Date(a);d<=b;d=addD(d,1)){const x=f(iso(d));if(x!=null)o.push(x)}return o};
const sm=a=>a.reduce((x,y)=>x+y,0),av=a=>a.length?sm(a)/a.length:null;
const cnt=(a,b)=>{let c=0;for(let d=new Date(a);d<=b;d=addD(d,1))if(D.health.some(h=>h.date===iso(d)))c++;return c};
const wl=(a,b)=>{const k=Object.keys(D.weight).sort().filter(k=>k>=iso(a)&&k<=iso(b));return k.length?D.weight[k[k.length-1]]:null};

function pinCard(){return'<div class="card"><h2>PIN-Sperre</h2><p class="k" style="margin:0 0 8px">Die PIN sperrt nur die Anzeige. Die gespeicherten Daten selbst werden nicht verschlüsselt.</p><div class="row"><div><label for="np">Neue PIN (4–8 Ziffern)</label><input type="password" id="np" inputmode="numeric" autocomplete="new-password"></div><button class="btn" onclick="setPin()">'+(D.pin?"PIN ändern":"PIN setzen")+'</button>'+(D.pin?'<button class="btn sec" onclick="rmPin()">PIN entfernen</button>':"")+"</div></div>"}
function planGoal(d){const p=D.plan;if(!(p.base>0&&p.start)||d<p.start)return null;const n=Math.floor((new Date(d+"T12:00:00")-new Date(p.start+"T12:00:00"))/864e5);return Math.max(0,p.base-Math.floor(n/p.every))}
function setPlan(){const b=Math.round(+$("pb").value),e=Math.round(+$("pe").value),pk=Math.round(+$("pk").value);if(b>0&&e>=1&&pk>=1){D.plan={base:b,every:e,price:+$("pp").value||0,pack:pk,start:D.plan.start&&D.plan.base===b?D.plan.start:today()};done()}}
function endPlan(){D.plan={base:0,every:7,price:0,pack:20,start:""};done()}
function planCard(){const p=D.plan,t=today(),x=D.smoke[t]||{},pg=planGoal(t);
const fm='<div class="row"><div><label for="pb">Ausgangsmenge (Zig. pro Tag)</label><input type="number" id="pb" min="1" value="'+(p.base||"")+'"></div><div><label for="pe">Um 1 reduzieren alle … Tage</label><input type="number" id="pe" min="1" value="'+p.every+'"></div></div><div class="row" style="margin-top:8px"><div><label for="pp">Preis pro Packung (€)</label><input type="number" id="pp" step="0.01" min="0" value="'+(p.price||"")+'"></div><div><label for="pk">Zigaretten pro Packung</label><input type="number" id="pk" min="1" value="'+p.pack+'"></div></div><div class="row" style="margin-top:10px"><button class="btn" onclick="setPlan()">'+(pg==null?"Plan starten":"Plan speichern")+"</button>"+(pg==null?"":'<button class="btn sec" onclick="endPlan()">Plan beenden</button>')+"</div>";
if(pg==null)return'<div class="card"><h2>Reduktionsplan</h2>'+fm+'<p class="k" style="margin:10px 0 0">Der Plan startet heute und senkt das Tagesziel schrittweise. Die Ersparnis rechnet die App gegenüber deiner Ausgangsmenge.</p></div>';
let fewer=0,ok=0,n=0;for(let d=new Date(p.start+"T12:00:00");iso(d)<=t;d=addD(d,1)){const k=iso(d),c=(D.smoke[k]||{}).cig;if(c==null)continue;n++;fewer+=Math.max(0,p.base-c);if(c<=planGoal(k))ok++}
const cpp=p.pack>0?p.price/p.pack:0;
return'<div class="grid"><div class="card"><div class="k">Tagesziel heute</div><div class="v">'+(pg===0?"rauchfrei":pg)+'</div><div class="bar"><i style="width:'+(pg?Math.min(100,(x.cig||0)/pg*100):((x.cig||0)>0?100:0))+'%"></i></div><div class="k">heute '+(x.cig||0)+'</div></div><div class="card"><div class="k">Gespart seit Planstart</div><div class="v">'+(cpp?(fewer*cpp).toFixed(2).replace(".",",")+" €":"–")+'</div><div class="k">'+fmt(fewer)+" Zigaretten weniger"+(cpp?"":" · Preis eintragen")+'</div></div></div><div class="card"><div class="k">Tage im Ziel</div><div class="v">'+ok+" von "+n+'</div><div class="k">erfasste Tage seit '+fmtD(p.start)+"</div></div>"+'<div class="card"><h2>Reduktionsplan</h2>'+fm+"</div>"}
function homeExtra(){const t=today(),g=D.goals,td=D.steps[t]||0,w=D.water[t]||0,x=D.smoke[t]||{},pg=planGoal(t),open=[];
if(td<g.steps)open.push("Schritte: noch "+fmt(g.steps-td));if(w<D.goal)open.push("Wasser: noch "+fmt(D.goal-w)+" ml");if(!D.sleep[t])open.push("Schlaf: noch nicht eingetragen");if(!D.log[t])open.push("Tagebuch: noch nicht ausgefüllt");
const mo=D.meds.filter(m=>!(D.medlog[t]||[]).includes(m.id));if(mo.length)open.push("Medikamente: "+mo.map(m=>esc(m.name)).join(", "));
const vk=Object.keys(D.vit).sort().reverse().find(k=>D.vit[k].sys!=null&&D.vit[k].dia!=null);
return'<div class="grid"><div class="card"><div class="k">Zigaretten heute</div><div class="v">'+(x.cig||0)+(pg!=null?" / "+pg:"")+'</div></div><div class="card"><div class="k">Blutdruck zuletzt</div><div class="v">'+(vk?D.vit[vk].sys+"/"+D.vit[vk].dia:"–")+'</div><div class="k">'+(vk?fmtD(vk).slice(0,5):"kein Wert")+"</div></div></div>"+'<div class="card"><h2>Heute noch offen</h2>'+(open.length?"<ul>"+open.map(o=>"<li><span>"+o+"</span></li>").join("")+"</ul>":'<p class="empty">Alles erledigt für heute.</p>')+"</div>"}
function dayCard(d){const L=[],s=D.steps[d],w=D.weight[d],sl=D.sleep[d],wa=D.water[d],hs=D.health.filter(h=>h.date===d),lg=D.log[d],v=D.vit[d],sm=D.smoke[d],ml=D.medlog[d],fo=D.food[d];
if(s!=null)L.push(["Schritte",fmt(s)]);if(w!=null)L.push(["Gewicht",w.toFixed(1)+" kg"]);if(sl)L.push(["Schlaf",sl.h+" h · Intensität "+sl.q]);if(wa!=null)L.push(["Wasser",fmt(wa)+" ml"]);
if(hs.length)L.push(["Beschwerden",hs.map(h=>h.sym.join(", ")+" ("+SEV[h.sev]+")").join("; ")]);
if(lg)L.push(["Tagebuch","Stimmung "+lg.mood+" · Training "+lg.train+" Min. · Koffein "+lg.coff+" mg · Alkohol "+lg.alc+" · Stuhlgang "+lg.stool+(lg.med?" · Medikamente":"")]);
if(v)L.push(["Körperwerte",[v.sys!=null&&v.dia!=null?"Blutdruck "+v.sys+"/"+v.dia:"",v.pulse!=null?"Puls "+v.pulse:"",v.fat!=null?"Fett "+v.fat+" %":"",v.waist!=null?"Taille "+v.waist+" cm":""].filter(Boolean).join(" · ")]);
if(sm)L.push(["Rauchen","Zigaretten "+(sm.cig==null?"–":sm.cig)+" · Pflaster "+(sm.patch==null?"–":sm.patch+" mg")+" · Vape "+(sm.vape==null?"–":sm.vape)]);
if(ml&&ml.length)L.push(["Medikamente",ml.length+" genommen"]);
if(fo)L.push(["Ernährung",fo.map(f=>esc(f.name)+(f.kcal?" ("+f.kcal+" kcal)":"")).join(", ")]);
return'<div class="card"><h2>'+fmtD(d)+'</h2>'+(L.length?"<ul>"+L.map(([a,b])=>"<li><span>"+a+'</span><span style="text-align:right">'+b+"</span></li>").join("")+"</ul>":'<p class="empty">Keine Einträge an diesem Tag.</p>')+"</div>"}
function addF(){const n=$("fn").value.trim();if(!n)return;const d=$("fe").value||today();(D.food[d]=D.food[d]||[]).push({meal:$("fm").value,name:n,kcal:+$("fk").value||0});done()}
function delF(d,i){D.food[d].splice(i,1);if(!D.food[d].length)delete D.food[d];done()}
function setKcal(){D.goals.kcal=Math.round(+$("fg").value)||0;done()}
function wfc(){const e=Object.keys(D.weight).sort();if(!e.length)return"";const cur=D.weight[e[e.length-1]],h=D.goals.height||0,gw=D.goals.weight||0;let s='<div class="k">BMI</div>';
if(h>0){const b=cur/((h/100)**2);s+='<div class="v">'+b.toFixed(1).replace(".",",")+'</div><div class="k">'+(b<18.5?"Untergewicht":b<25?"Normalgewicht":b<30?"Übergewicht":"Adipositas")+" (grober Richtwert, WHO)</div>"}else s+='<div class="k">Trage deine Körpergröße unter Übersicht, Ziele ein.</div>';
const lim=iso(addD(new Date(),-42)),r=e.filter(k=>k>=lim);s+='<div class="k" style="margin-top:12px">Trend der letzten 6 Wochen</div>';
if(r.length>=3){const t0=new Date(r[0]+"T12:00:00"),xs=r.map(k=>(new Date(k+"T12:00:00")-t0)/864e5),ys=r.map(k=>D.weight[k]),mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2});
if(xs[xs.length-1]>=7&&de>0){const sl=nu/de,gap=gw-cur;s+='<div class="v">'+(sl>0?"+":"")+(sl*7).toFixed(2).replace(".",",")+' kg pro Woche</div><div class="k">'+(!gw?"Setze ein Zielgewicht für eine Prognose.":Math.abs(gap)<0.05?"Zielgewicht erreicht.":sl*gap>0&&Math.ceil(gap/sl)<=1825?"Zielgewicht voraussichtlich am "+fmtD(iso(addD(new Date(),Math.ceil(gap/sl))))+".":sl*gap>0?"Zielgewicht erst in über fünf Jahren.":"Der aktuelle Trend führt vom Zielgewicht weg.")+"</div>"}else s+='<div class="k">Die Einträge müssen mindestens 7 Tage auseinanderliegen.</div>'}else s+='<div class="k">Für eine Prognose werden mindestens 3 Einträge der letzten 6 Wochen benötigt.</div>';
return'<div class="card">'+s+"</div>"}
function trig(){const fd=D.food,days=Object.keys(fd);
const wd=d=>{const o=new Set();[d,pd1(d)].forEach(k=>(fd[k]||[]).forEach(f=>f.name.toLowerCase().split(/[^a-zäöüß]+/).filter(w=>w.length>=4).forEach(w=>o.add(w))));return o};
let body;
if(days.length<7)body='<p class="empty">Für Auslöser-Muster brauchst du Ernährungseinträge an mindestens 7 Tagen (aktuell '+days.length+").</p>";
else{const bc={};days.forEach(d=>wd(d).forEach(w=>bc[w]=(bc[w]||0)+1));const out=[];
SYM.forEach(s=>{const sd=[...new Set(D.health.filter(h=>h.sym.includes(s)).map(h=>h.date))].filter(d=>days.includes(d)||days.includes(pd1(d)));if(sd.length<3)return;
const sc={};sd.forEach(d=>wd(d).forEach(w=>sc[w]=(sc[w]||0)+1));
const c=Object.keys(sc).filter(w=>sc[w]>=2&&sc[w]/sd.length>1.5*(bc[w]||0)/days.length).sort((a,b)=>sc[b]-sc[a]).slice(0,3);
out.push("<li><span><b>"+s+"</b><br><small>"+(c.length?c.map(w=>esc(w)+" ("+sc[w]+" von "+sd.length+" Beschwerdetagen · allgemein "+Math.round((bc[w]||0)/days.length*100)+" %)").join("<br>"):"Keine auffälligen Zutaten gefunden")+"</small></span></li>")});
body=out.length?"<ul>"+out.join("")+"</ul>":'<p class="empty">Noch zu wenig Beschwerdetage mit Ernährungsdaten (je Beschwerde mindestens 3).</p>'}
return'<div class="card"><h2>Mögliche Auslöser</h2>'+body+'<p class="k" style="margin:10px 0 0">Verglichen werden Wörter aus deinen Mahlzeiten am Tag der Beschwerde und am Vortag mit allen anderen Tagen. Das sind nur Hinweise, keine Diagnose.</p></div>'}
function edS(k){const x=D.smoke[k],v=f=>x[f]==null?"":x[f];$("rd").value=k;$("rc").value=v("cig");$("rp").value=v("patch");$("rv").value=v("vape");$("rc").focus()}
function trk(){const lim=iso(addD(new Date(),-29));
const rows=SYM.map(s=>({s,d:[...new Set(D.health.filter(h=>h.sym.includes(s)).map(h=>h.date))].sort()})).filter(x=>x.d.length).sort((a,b)=>b.d.length-a.d.length);
if(!rows.length)return'<div class="card"><h2>Häufigkeit je Beschwerde</h2><p class="empty">Sobald du Beschwerden einträgst, siehst du hier, wie oft und wann sie aufgetreten sind.</p></div>';
return'<div class="card"><h2>Häufigkeit je Beschwerde</h2>'+rows.map(({s,d})=>{const l=d[d.length-1],ago=Math.round((new Date(today())-new Date(l))/864e5);
return'<details style="border-top:1px solid var(--line);padding:10px 0"><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:8px"><b>'+s+'</b><span>'+d.length+'×</span></summary><p class="k" style="margin:8px 0 4px">Letztes Mal: '+fmtD(l)+(ago===0?" (heute)":ago===1?" (gestern)":" (vor "+ago+" Tagen)")+' · letzte 30 Tage: '+d.filter(x=>x>=lim).length+'×</p><p class="k" style="margin:0">Alle Tage: '+[...d].reverse().map(fmtD).join(", ")+'</p></details>'}).join("")+'</div>'}
const cur0=()=>D.water[today()]||0;
const done=()=>{save();draw()};
function addSteps(){const v=+$("sv").value;if(!(v>=0)||$("sv").value==="")return;D.steps[$("sd").value||today()]=Math.round(v);done()}
function addW(){const v=+$("wv").value;if(!(v>0))return;D.weight[$("wd").value||today()]=v;done()}
function addSl(){let v=+$("kh").value;const b=$("kb").value,w=$("kw").value;if(!(v>0)&&b&&w){v=Math.round(((toM(w)-toM(b)+1440)%1440)/15)/4}if(!(v>0))return;const o={h:v,q:+$("kq").value};if(b)o.bed=b;if(w)o.wake=w;if($("kn").value!=="")o.wk=+$("kn").value;D.sleep[$("kd").value||today()]=o;done()}
function tog(s){const i=sel.indexOf(s);i<0?sel.push(s):sel.splice(i,1);const d=$("hd").value,n=$("hn").value,v=$("hs").value;draw();$("hd").value=d;$("hn").value=n;$("hs").value=v}
function addH(){if(!sel.length)return;const o={date:$("hd").value||today(),sym:[...sel],sev:+$("hs").value,note:$("hn").value.trim()};if(editH!=null){D.health[editH]=o;editH=null}else D.health.push(o);sel=[];done()}
function delH(i){D.health.splice(i,1);done()}
function del(t,k){delete D[t][k];done()}
function addWa(n){if(!n)return;D.water[today()]=Math.max(0,cur0()+Math.round(n));done()}
function setG(){const v=+$("wg").value;if(v>=500){D.goal=Math.round(v);done()}}
let menu=false;
function draw(){if(locked){$("nav").innerHTML="";$("view").innerHTML='<div class="card"><h2>Gesperrt</h2><label for="pin">PIN</label><input type="password" id="pin" inputmode="numeric" autocomplete="off" onkeydown="if(event.key===\'Enter\')unlock()"><button class="btn" style="margin-top:10px" onclick="unlock()">Entsperren</button><p id="pe2" class="k"></p></div>';return}const cur=TABS.find(x=>x[0]===tab)[1];$("nav").innerHTML='<button aria-expanded="'+menu+'" aria-label="Menü" onclick="menu=!menu;draw()" style="font-weight:700"><svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M0 1h20M0 7h20M0 13h20" stroke="currentColor" stroke-width="2"/></svg>'+cur+'</button>'+(menu?'<div class="mn">'+GROUPS.map(([g,ks])=>'<div class="mh">'+g+"</div>"+ks.map(k=>'<button aria-selected="'+(k===tab)+'" onclick="tab=\''+k+'\';menu=false;draw();window.scrollTo(0,0)">'+TABS.find(x=>x[0]===k)[1]+"</button>").join("")).join("")+"</div>":"");$("view").innerHTML=R[tab]()}
draw();
</script>
</body>
